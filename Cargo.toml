[package]
name = "limma-core"
description = "Pure-Rust port of the limma linear-model / empirical-Bayes core (lmFit, contrasts.fit, eBayes, topTable, decideTests, camera) with R-faithful nmath and lowess."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/MassDynamics/limma-rust"

[dependencies]
thiserror = "2"

[dev-dependencies]
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
